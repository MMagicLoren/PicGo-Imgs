<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080">
<rect width="1600" height="1080" fill="#FFFBF2"/>
<text x="800.0" y="70" text-anchor="middle" font-size="44" font-weight="bold" fill="#4A3F2F" font-family="Noto Serif CJK SC">动作计算：两条路线</text>
<text x="800.0" y="114" text-anchor="middle" font-size="25" fill="#8A7B63" font-family="Noto Serif CJK SC">输入都是 T_base_wrist 轨迹；区别只在第③步怎么算 action</text>
<rect x="215" y="140" width="478" height="80" rx="24" fill="#FFFFFF" stroke="#E0D3B8" stroke-width="2.5"/>
<polygon points="213,180 191,168 213,196" fill="#FFFFFF" stroke="#E0D3B8" stroke-width="2.5"/>
<text x="237" y="190" font-size="27" fill="#4A3F2F" font-family="Noto Serif CJK SC">A 把重定向「设计掉」，B 更原生！</text>
<rect x="200" y="230" width="640" height="620" rx="18" fill="#FFF4E3" stroke="#E8862E" stroke-width="3.5"/>
<text x="236" y="288" font-size="31" font-weight="bold" fill="#4A3F2F" font-family="Noto Serif CJK SC">路线 A · 相对 SE(3)（推荐）</text>
<rect x="778" y="248" width="46" height="32" rx="16" fill="#E8862E"/>
<text x="801" y="272" text-anchor="middle" font-size="25" fill="#FFFFFF" font-family="Noto Serif CJK SC">★</text>
<text x="236" y="338" font-size="22" fill="#4A3F2F" font-family="Noto Serif CJK SC" font-weight="bold">action[t] = inv(T_base_wrist[t])</text>
<text x="236" y="376" font-size="22" fill="#8A7B63" font-family="Noto Serif CJK SC">@ T_base_wrist[t+k] → 10 维 = pos(3)+rot6d(6)+夹爪(1)</text>
<text x="236" y="414" font-size="22" fill="#8A7B63" font-family="Noto Serif CJK SC">夹爪 = 拇指–食指指尖距离归一化</text>
<text x="236" y="452" font-size="22" fill="#8A7B63" font-family="Noto Serif CJK SC">离线：只做坐标变换 + 相对化，不解 IK</text>
<text x="236" y="490" font-size="22" fill="#8A7B63" font-family="Noto Serif CJK SC">部署：Cartesian 控制器跟踪</text>
<text x="236" y="528" font-size="22" fill="#8A7B63" font-family="Noto Serif CJK SC">target = current_ee_pose @ relative_action</text>
<text x="236" y="566" font-size="22" fill="#8A7B63" font-family="Noto Serif CJK SC">UMI 的 rtde / franka interpolation 控制器即此模式</text>
<rect x="880" y="230" width="660" height="620" rx="18" fill="#FFFFFF" stroke="#E0D3B8" stroke-width="2.5"/>
<text x="916" y="288" font-size="31" font-weight="bold" fill="#4A3F2F" font-family="Noto Serif CJK SC">路线 B · 差分 IK</text>
<text x="916" y="338" font-size="22" fill="#4A3F2F" font-family="Noto Serif CJK SC" font-weight="bold">每帧 T_base_wrist[t] → mink.solve_ik</text>
<text x="916" y="376" font-size="22" fill="#8A7B63" font-family="Noto Serif CJK SC">→ 关节角 q / 关节速度 action</text>
<text x="916" y="414" font-size="22" fill="#8A7B63" font-family="Noto Serif CJK SC">FrameTask + PostureTask；限位 · 碰撞内部处理</text>
<text x="916" y="452" font-size="22" fill="#8A7B63" font-family="Noto Serif CJK SC">更「机器人原生」，policy 直接输出关节量</text>
<text x="916" y="490" font-size="22" fill="#4A3F2F" font-family="Noto Serif CJK SC" font-weight="bold">注意：IK 失败 / 奇异位形要离线处理</text>
<text x="916" y="528" font-size="22" fill="#4A3F2F" font-family="Noto Serif CJK SC" font-weight="bold">注意：工作空间限制要离线过滤</text>
<text x="916" y="566" font-size="22" fill="#8A7B63" font-family="Noto Serif CJK SC">API 已按 mink 1.3.0 wheel 源码核实</text>
<rect x="60" y="900" width="1480" height="120" rx="16" fill="#F6EFE0" stroke="#E0D3B8" stroke-width="2"/>
<text x="230" y="948" font-size="23" font-weight="bold" fill="#4A3F2F" font-family="Noto Serif CJK SC">噜妹划重点</text>
<text x="230" y="986" font-size="22" fill="#4A3F2F" font-family="Noto Serif CJK SC">路线 A 把复杂重定向「设计掉」，ego 起步推荐；路线 B 更机器人原生，但离线要处理 IK 失败与工作空间限制。</text>
</svg>